<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza, Bro! — Горячо, брат</title>
    <meta name="description" content="Пиццерия Pizza, Bro!: пицца на дровах за 30 минут. Тесто на закваске, дружеская доставка.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob--1"></div>
        <div class="blob blob--2"></div>
    </div>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo" aria-label="Pizza, Bro! — на главную">
                <span class="logo__dot"></span>
                Pizza, Bro!
            </a>

            <nav class="nav" id="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a href="#hero" class="nav__link nav__link--active">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link">Меню</a></li>
                    <li><a href="#showcase" class="nav__link">Пиццы недели</a></li>
                    <li><a href="#sale-pizzas" class="nav__link">Акции</a></li>
                    <li><a href="#reviews" class="nav__link">Отзывы</a></li>
                    <li><a href="#features" class="nav__link">О нас</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="icon-btn" id="themeToggle" type="button" aria-label="Сменить тему">
                    <span class="theme-toggle__icon">☀️</span>
                </button>
                <button class="icon-btn cart-btn" id="cartBtn" type="button" aria-label="Корзина">
                    <span>🛒</span>
                    <span class="cart-btn__count" id="cartCount">0</span>
                </button>
                <button class="burger" id="burger" type="button" aria-label="Открыть меню" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main></main>

</body>
</html>
